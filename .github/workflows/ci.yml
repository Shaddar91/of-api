#Managed by Terraform; edits made here are overwritten on its next apply.
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  PUBLISH: ${{ github.ref == 'refs/heads/master' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: of
          POSTGRES_PASSWORD: of
          POSTGRES_DB: of
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U of"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - env:
          DATABASE_URL: postgresql://of:of@localhost:5432/of
        run: pytest -q

  build:
    needs: test
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      #no attestations: each <sha>-<arch> tag must point at the image manifest itself, never at an index
      - run: docker build --platform linux/${{ matrix.arch }} --provenance=false --sbom=false -t of-api:ci .
      - run: |
          docker run -d -p 8000:8000 --name of-api of-api:ci
          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 localhost:8000/healthz || { docker logs of-api; exit 1; }
      - if: env.PUBLISH == 'true'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - if: env.PUBLISH == 'true'
        uses: aws-actions/amazon-ecr-login@v2.1.7
      - if: env.PUBLISH == 'true'
        env:
          IMAGE: ${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}-${{ matrix.arch }}
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "$IMAGE exists and the repository is immutable: push skipped"
          else
            docker tag of-api:ci "$IMAGE"
            docker push "$IMAGE"
          fi

  manifest:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2.1.7
      - uses: docker/setup-buildx-action@v4.4.1
      - env:
          REPO: ${{ secrets.ECR_REPOSITORY }}
        run: |
          if docker manifest inspect "$REPO:$GITHUB_SHA" > /dev/null 2>&1; then
            echo "$REPO:$GITHUB_SHA exists and the repository is immutable: index skipped"
          else
            docker buildx imagetools create -t "$REPO:$GITHUB_SHA" "$REPO:$GITHUB_SHA-amd64" "$REPO:$GITHUB_SHA-arm64"
          fi
